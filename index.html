<!doctype html>
<html lang="tr" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="X-Tavla - Modern mobil tavla. Bilgisayara karşı veya online lobide oyna." />
  <title>X-Tavla · Modern Tavla</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="h-full bg-oled text-slate-100 font-sans select-none overflow-hidden">
  <div id="app" class="h-full w-full flex flex-col">

    <!-- MENU -->
    <section id="screen-menu" class="screen flex-1 flex flex-col items-center justify-center gap-6 p-6">
      <div class="text-center">
        <div class="logo text-6xl font-black tracking-tight">X<span class="text-neon-cyan">-</span>Tavla</div>
        <p class="text-slate-400 mt-2 text-sm">Modern Backgammon · OLED Edition</p>
      </div>
      <div class="w-full max-w-xs flex flex-col gap-3">
        <button id="btn-ai" class="btn-primary">🤖 Bilgisayara Karşı</button>
        <div class="flex items-center gap-2 text-sm">
          <label for="ai-level" class="text-slate-400">Zorluk:</label>
          <select id="ai-level" class="flex-1 bg-panel border border-slate-700 rounded-lg px-3 py-2">
            <option value="easy">Kolay</option>
            <option value="normal" selected>Normal</option>
            <option value="hard">Zor</option>
          </select>
        </div>
        <button id="btn-online" class="btn-neon">🌐 Online Bekleme Odası</button>
        <button id="btn-local" class="btn-ghost">👥 Aynı Cihazda 2 Kişi</button>
        <label class="flex items-center gap-2 text-sm text-slate-400 mt-1">
          <input id="opt-sound" type="checkbox" checked class="accent-cyan-400 w-4 h-4" /> Ses ve titreşim
        </label>
      </div>
      <p class="text-xs text-slate-600">v1.0.0 · Mars = 2 puan, Tavla(Backgammon) = 3 puan</p>
    </section>

    <!-- LOBBY -->
    <section id="screen-lobby" class="screen hidden flex-1 flex flex-col p-4 gap-3 max-w-lg w-full mx-auto">
      <header class="flex items-center justify-between">
        <button id="btn-lobby-back" class="btn-icon" aria-label="Geri">←</button>
        <h2 class="text-xl font-bold">Bekleme Odası</h2>
        <span id="lobby-dot" class="w-3 h-3 rounded-full bg-slate-600" title="Bağlantı"></span>
      </header>
      <div class="flex gap-2">
        <input id="lobby-name" maxlength="16" placeholder="Takma adın" class="flex-1 bg-panel border border-slate-700 rounded-lg px-3 py-2" />
        <button id="btn-lobby-join" class="btn-neon !py-2 !px-4 !w-auto">Katıl</button>
      </div>
      <p id="lobby-status" class="text-sm text-slate-400">Lobiye bağlanmak için adını yaz ve Katıl'a bas.</p>
      <button id="btn-quick-match" class="btn-primary" disabled>⚡ Otomatik Eşleş</button>
      <div class="flex items-center justify-between text-xs text-slate-500 mt-1">
        <span>Bekleyen oyuncular</span>
        <span id="my-id" class="truncate max-w-[60%]"></span>
      </div>
      <ul id="lobby-list" class="flex-1 overflow-y-auto flex flex-col gap-2"></ul>
      <details class="text-xs text-slate-500">
        <summary class="cursor-pointer">Kod ile bağlan</summary>
        <div class="flex gap-2 mt-2">
          <input id="direct-id" placeholder="Rakip ID" class="flex-1 bg-panel border border-slate-700 rounded-lg px-3 py-2" />
          <button id="btn-direct" class="btn-ghost !py-2 !px-4 !w-auto">Meydan Oku</button>
        </div>
      </details>
    </section>

    <!-- GAME -->
    <section id="screen-game" class="screen hidden flex-1 flex flex-col min-h-0">
      <header class="flex items-center justify-between px-3 py-2 gap-2">
        <button id="btn-game-back" class="btn-icon" aria-label="Menü">☰</button>
        <div id="turn-indicator" class="flex-1 text-center text-sm font-semibold truncate"></div>
        <div id="score" class="text-xs text-slate-400 whitespace-nowrap">0 - 0</div>
      </header>
      <div id="game-body" class="flex-1 flex min-h-0 items-center justify-center gap-2 px-2">
        <div id="board-wrap" class="relative">
          <div id="board" class="board"></div>
          <div id="dice-area" class="dice-area"></div>
        </div>
        <aside id="controls" class="controls">
          <button id="btn-roll" class="btn-primary">🎲 Zar At</button>
          <button id="btn-undo" class="btn-ghost">↶ Geri Al</button>
          <p id="status" class="text-xs text-slate-400 text-center min-h-[2.5em]"></p>
        </aside>
      </div>
    </section>

    <!-- MODAL -->
    <div id="modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-6">
      <div class="bg-night border border-slate-700 rounded-2xl p-6 w-full max-w-sm shadow-neon">
        <h3 id="modal-title" class="text-xl font-bold mb-2"></h3>
        <div id="modal-body" class="text-slate-300 text-sm mb-4"></div>
        <div id="modal-actions" class="flex gap-2 justify-end"></div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
